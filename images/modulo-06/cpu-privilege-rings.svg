<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: bold; text-anchor: middle; }
      .subtitle { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; text-anchor: middle; }
      .ring-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: #ffffff; }
      .ring-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; text-anchor: middle; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="650" height="540" rx="16" class="bg" />

  <!-- Title -->
  <text x="325" y="38" class="title">Gli Anelli di Privilegio della CPU (x86 Protection Rings)</text>
  <text x="325" y="62" class="subtitle">La barriera hardware invalicabile tra il Sistema Operativo e le App Utente</text>

  <!-- Concentric Circles (Center cx=325, cy=290) -->
  <!-- Ring 3: User Space (External) -->
  <circle cx="325" cy="290" r="215" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />

  <!-- Ring 2: Device Drivers (Historical/OS dependent) -->
  <circle cx="325" cy="290" r="165" fill="#334155" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2" />

  <!-- Ring 1: OS Services -->
  <circle cx="325" cy="290" r="120" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 2" />

  <!-- Ring 0: Kernel Mode (Deepest core) -->
  <circle cx="325" cy="290" r="75" fill="#7f1d1d" stroke="#ef4444" stroke-width="4" />

  <!-- Ring 0 Labels -->
  <circle cx="325" cy="290" r="12" fill="#ef4444" opacity="0.3" />
  <text x="325" y="275" class="ring-title" fill="#fca5a5">RING 0</text>
  <text x="325" y="295" font-family="system-ui, sans-serif" font-size="12px" font-weight="bold" fill="#ffffff" text-anchor="middle">KERNEL</text>
  <text x="325" y="312" class="ring-desc" fill="#fecaca">Accesso Totale Hardware</text>
  <text x="325" y="327" class="ring-desc" fill="#fecaca">CPU, RAM, Dischi, MMU</text>

  <!-- Ring 1 / 2 Labels -->
  <text x="325" y="195" font-family="system-ui, sans-serif" font-size="12px" fill="#93c5fd" font-weight="bold" text-anchor="middle">RING 1 &amp; 2 (Driver &amp; Servizi di Sistema)</text>
  <text x="325" y="210" class="ring-desc">Privilegi intermedi (spesso unificati in Ring 0)</text>

  <!-- Ring 3 Labels (Top and Bottom) -->
  <text x="325" y="105" class="ring-title" fill="#38bdf8">RING 3: USER MODE (Spazio Utente)</text>
  <text x="325" y="122" class="ring-desc">Applicazioni, Browser, Giochi, Editor di Testo, Script Python</text>
  <text x="325" y="137" font-family="system-ui, sans-serif" font-size="11px" fill="#f87171" font-weight="600" text-anchor="middle">⛔ Istruzioni hardware pericolose rigorosamente VIETATE dalla CPU</text>

  <!-- System Call Bridge Indicator -->
  <g transform="translate(485, 230)">
    <rect x="0" y="0" width="135" height="110" rx="8" fill="#0284c7" opacity="0.9" />
    <text x="67" y="22" font-family="system-ui, sans-serif" font-size="11px" font-weight="bold" fill="#ffffff" text-anchor="middle">IL PONTE SICURO</text>
    <text x="67" y="42" font-family="monospace" font-size="12px" font-weight="bold" fill="#ffffff" text-anchor="middle">SYSTEM CALL</text>
    <text x="67" y="62" font-family="system-ui, sans-serif" font-size="10px" fill="#e0f2fe" text-anchor="middle">Unica via lecita per</text>
    <text x="67" y="78" font-family="system-ui, sans-serif" font-size="10px" fill="#e0f2fe" text-anchor="middle">chiedere file o rete</text>
    <text x="67" y="96" font-family="system-ui, sans-serif" font-size="10px" font-weight="bold" fill="#fef08a" text-anchor="middle">(es. read, write, fork)</text>
  </g>

  <!-- Left Callout: General Protection Fault -->
  <g transform="translate(30, 230)">
    <rect x="0" y="0" width="135" height="110" rx="8" fill="#991b1b" opacity="0.9" />
    <text x="67" y="22" font-family="system-ui, sans-serif" font-size="11px" font-weight="bold" fill="#ffffff" text-anchor="middle">TENTATA VIOLAZIONE</text>
    <text x="67" y="44" font-family="monospace" font-size="12px" font-weight="bold" fill="#fecaca" text-anchor="middle">SEGFAULT / GPF</text>
    <text x="67" y="65" font-family="system-ui, sans-serif" font-size="10px" fill="#fee2e2" text-anchor="middle">Se un'app tocca la</text>
    <text x="67" y="80" font-family="system-ui, sans-serif" font-size="10px" fill="#fee2e2" text-anchor="middle">RAM del kernel, la</text>
    <text x="67" y="96" font-family="system-ui, sans-serif" font-size="10px" font-weight="bold" fill="#fca5a5" text-anchor="middle">CPU la termina subito!</text>
  </g>

  <!-- Bottom Legend -->
  <rect x="50" y="505" width="550" height="25" rx="6" fill="#1e293b" />
  <text x="325" y="522" font-family="system-ui, sans-serif" font-size="11px" fill="#94a3b8" text-anchor="middle">
    🛡️ Gli anelli di protezione sono implementati nei transistor del processore, non sono semplici righe di software!
  </text>
</svg>
